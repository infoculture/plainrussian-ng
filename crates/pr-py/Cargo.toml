[package]
name = "pr-py"
description = "Python-пакет plainrussian: привязки к pr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pr-core = { workspace = true, features = ["clarity"] }
# Словарь rumorph встроен в модуль (feature bundled по умолчанию): около 16 МБ.
rumorph = "0.4"
serde.workspace = true
serde_json.workspace = true
# abi3: одно колесо для всех версий Python начиная с 3.9.
pyo3 = { version = "0.30", features = ["abi3-py39"] }

[features]
# Включает maturin при сборке колеса; без него крейт собирается и тестируется как обычный.
extension-module = ["pyo3/extension-module"]
