[package]
name = "pr-core"
description = "Оценка простоты (читаемости) русскоязычных текстов"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
# Морфология для проверок ясного языка. Словарь подключает тот, кто использует
# ядро: встроенный (feature bundled у rumorph) или загруженный в браузере.
rumorph = { version = "0.4", default-features = false, optional = true }

[features]
clarity = ["dep:rumorph"]

[dev-dependencies]
rumorph = { version = "0.4" }
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "0.10"
