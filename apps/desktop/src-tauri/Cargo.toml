[package]
name = "plainrussian-desktop"
description = "Настольное приложение «Простой русский»"
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
rust-version = "1.85"

# Отдельное рабочее пространство: см. exclude в корневом Cargo.toml.
[workspace]

[lib]
name = "plainrussian_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", features = ["gzip"] }
encoding_rs = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
