[workspace]
resolver = "3"
members = ["crates/pr-core", "crates/pr-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "CC0-1.0"
rust-version = "1.85"

[workspace.dependencies]
pr-core = { path = "crates/pr-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
